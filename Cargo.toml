[workspace]

[package]
name = "tandera-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line client for the Tandera security platform API."
license = "UNLICENSED"
publish = false

[lib]
name = "tandera_cli"
path = "src/lib.rs"

[[bin]]
name = "tandera"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
ipnetwork = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rustyline = "14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
